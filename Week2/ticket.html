<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ticket.css">
    <script src="ticket.js" defer></script>
</head>
<body>
    <main>
        <h1>Event Ticket</h1>
        <form id="ticketForm">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required />
            </div>

            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required>
            </div>

            <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
                <label for="type">Type</label>
                <select
                    id="type"
                    name="type"
                    aria-controls="notesContainer"
                    required
                >
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>        
                </select>
            </div>

            <div class="field">
                <label for="date">Event Date</label>
                <input id="date" name="date" type="date" required />
            </div>
            
            <!-- field full hidden表示三个class -->
            <div id="hello" class="field full hidden">
                <label for="studentID">Student 1#</label>
                <input id="studentID" name="studentID" type="studentID" required />
            </div>

            <div id="zj" class="field full hidden">
                <label for="accessCode">Access Code</label>
                <input id="accessCode" name="accessCode" type="accessCode" required />
            </div>

            <button class="full" id="hey" type="submit">Create Ticket</button>
        </form>
         
        <section id="output" aria-live="polite"></section>
    </main>
    
</body>
</html>
